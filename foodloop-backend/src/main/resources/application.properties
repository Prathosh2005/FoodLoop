spring.application.name=foodloop-backend

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/foodloop_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080

# JWT Security Configuration
foodloop.jwt.secret=${FOODLOOP_JWT_SECRET}
foodloop.jwt.expiration-ms=${FOODLOOP_JWT_EXPIRATION_MS:86400000}

